{
  "openapi": "3.1.0",
  "info": {
    "title": "INLABS DOU Middleware",
    "version": "1.2.0",
    "description": "Index leve (snippets) + endpoint de detalhe por item."
  },
  "servers": [
    {
      "url": "https://inlabsassn-production.up.railway.app"
    }
  ],
  "paths": {
    "/health": {
      "get": {
        "operationId": "health",
        "summary": "Healthcheck",
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthResponse"
                }
              }
            }
          }
        }
      }
    },
    "/dou/transmissao": {
      "post": {
        "operationId": "buscar_dou_transmissao",
        "summary": "Index leve: lista itens relevantes (snippet)",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "requestBody": {
          "required": false,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/IndexRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/IndexResponse"
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "Captcha/valida\u00e7\u00e3o humana",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "500": {
            "description": "Erro interno",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    },
    "/dou/item": {
      "post": {
        "operationId": "buscar_item_dou",
        "summary": "Detalhe: full_text (plain) de um item",
        "security": [
          {
            "ApiKeyAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/ItemRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "OK",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ItemResponse"
                }
              }
            }
          },
          "400": {
            "description": "Bad request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "401": {
            "description": "Unauthorized",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "404": {
            "description": "Not found",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "409": {
            "description": "Captcha/valida\u00e7\u00e3o humana",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          },
          "500": {
            "description": "Erro interno",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorResponse"
                }
              }
            }
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "ApiKeyAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "X-API-Key"
      }
    },
    "schemas": {
      "HealthResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean"
          }
        },
        "required": [
          "ok"
        ]
      },
      "IndexRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "date": {
            "type": "string",
            "description": "YYYY-MM-DD. Se omitido, usa a \u00faltima pasta dispon\u00edvel."
          },
          "max_items": {
            "type": "integer",
            "default": 40
          },
          "max_zips": {
            "type": "integer",
            "default": 6
          },
          "snippet_max_chars": {
            "type": "integer",
            "default": 900
          }
        }
      },
      "IndexItem": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string"
          },
          "zip_name": {
            "type": "string"
          },
          "entry_name": {
            "type": "string"
          },
          "section": {
            "type": "string"
          },
          "act_type": {
            "type": "string"
          },
          "title": {
            "type": "string"
          },
          "snippet": {
            "type": "string"
          },
          "triggers": {
            "type": "array",
            "items": {
              "type": "string"
            }
          },
          "entities_matched": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "id",
          "zip_name",
          "entry_name",
          "section",
          "act_type",
          "title",
          "snippet",
          "triggers",
          "entities_matched"
        ]
      },
      "IndexResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "date_used": {
            "type": "string"
          },
          "source": {
            "type": "string"
          },
          "items": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/IndexItem"
            }
          }
        },
        "required": [
          "date_used",
          "source",
          "items"
        ]
      },
      "ItemRequest": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "date": {
            "type": "string"
          },
          "zip_name": {
            "type": "string"
          },
          "entry_name": {
            "type": "string"
          },
          "full_text_max_chars": {
            "type": "integer",
            "default": 250000
          }
        },
        "required": [
          "date",
          "zip_name",
          "entry_name"
        ]
      },
      "ItemResponse": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "full_text": {
            "type": "string"
          },
          "full_text_truncated": {
            "type": "boolean"
          }
        },
        "required": [
          "full_text",
          "full_text_truncated"
        ]
      },
      "ErrorResponse": {
        "type": "object",
        "additionalProperties": true,
        "properties": {
          "error_code": {
            "type": "string"
          },
          "message": {
            "type": "string"
          },
          "stage": {
            "type": [
              "string",
              "null"
            ]
          },
          "detail": {
            "type": [
              "string",
              "null"
            ]
          }
        },
        "required": [
          "error_code",
          "message"
        ]
      }
    }
  }
}
